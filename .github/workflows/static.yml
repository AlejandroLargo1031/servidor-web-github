name: Blue/Green Deployment and Rollback

on:
  push:
    branches: [blue]
  workflow_dispatch:

permissions:
  contents: write  # Permite que GitHub Actions haga push

jobs:
  deploy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Clona todo el historial

      - name: Simulación de pruebas automatizadas
        run: |
          echo "Ejecutando pruebas en la versión Blue..."
          sleep 3  # Simula pruebas
          if grep -q "Versión Blue" index.html; then
            echo "Pruebas exitosas"
          else
            echo "Pruebas fallidas"
            exit 1
          fi

      - name: Promover Blue a Green (Si las pruebas son exitosas)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "alejandrolargo1031"
          git config --global user.email "alejandropulidolargo@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin
          git checkout green
          git merge origin/blue -m "Promoviendo la versión Blue a Green"
          git push origin green

  rollback:
    runs-on: ubuntu-latest
    if: failure()  # Se activa solo si fallan las pruebas
    steps:
      - name: Restaurar la última versión estable de Green
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fallo detectado. Restaurando la última versión estable de Green..."
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch origin
          git checkout green
          git reset --hard origin/green
          git push origin green --force
